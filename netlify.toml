[build]
  # The stamp first (#698): `tools/build-stamp.js` writes COMMIT_REF into
  # `netlify/lib/build-stamp.js` before the functions are bundled, so
  # `checkout-session-status` can name the build it is running. It is not part
  # of `npm run build`, on purpose: a local build must not rewrite the file.
  command = "node tools/build-stamp.js && npm run build"
  publish = "_site"
  functions = "netlify/functions"

# app.prospektor.ai is retired (operator decision, 18 Aug 2026). It served the
# pre-pivot agency page — apply, 90 days, $25k — which is not something
# Prospektor sells any more. The subdomain keeps resolving on purpose: old
# links, email signatures and search results should land on the product that
# does exist rather than on a 404.
[[redirects]]
  from = "https://app.prospektor.ai/*"
  to = "https://prospektor.ai/"
  status = 301
  force = true

[[redirects]]
  from = "/app/*"
  to = "/"
  status = 301
  force = true

# The old help guides (studio #1201, 7 Oct 2026). Until then /help/<slug>/
# was one of the studio's thirteen long reference files; now /help/ is short
# articles, one question each, and those pages are gone. Each old address
# answers 301 to the article that took its place, or to /help/ where no one
# article did, so links in mails, search results and other people's pages
# land on a real page. Not forced: a path the build writes is served as it is.
# The Spanish edition's old addresses go to the same article in Spanish, and
# anything left under /es/help/ that the build did not write falls back to its
# English twin. `test/help.test.js` holds every old address to a rule here
# and every rule to a page the build wrote.
[[redirects]]
  from = "/help/getting-started/*"
  to = "/help/get-started/"
  status = 301

[[redirects]]
  from = "/help/first-visit/*"
  to = "/help/get-started/"
  status = 301

